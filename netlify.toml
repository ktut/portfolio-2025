# Proxy/redirect rules for /thisbigbaby live in public/_redirects (single
# source of truth) so ordering is unambiguous. See that file.

# SPA fallback - serve index.html for all routes
# The 'force = false' ensures existing files are served first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for better caching and OG tag support
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"